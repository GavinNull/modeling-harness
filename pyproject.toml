[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-harness"
version = "2.5.0"
description = "Isolated multi-agent runtime and evaluation harness for mathematical modeling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.scripts]
modeling-harness = "modeling_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
