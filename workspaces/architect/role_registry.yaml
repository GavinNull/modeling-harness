schema_version: "2.5.0"
registry_id: modeling-harness-role-registry
agent_version: generic-agent-v2.5
agent_body_provenance_policy:
  boundary_revision: sound-by-construction-r3e
  agent_identity: generic-agent-v2.5
  package_version: 2.5.0
  authorization_sources: [DIRECT_USER, INDEPENDENT_GENERAL_RESEARCH]
  direct_user_carrier: DirectUserExecutableInstructionV1
  direct_user_instruction_enum: [APPLY_REVIEWED_GENERIC_GOVERNANCE_CHANGE]
  research_carrier: IndependentGeneralResearchManifestV1
  research_manifest_payload: hashes-and-closed-enums-only
  dtp_carrier: DTPV1
  map_carrier: MAPV1
  authorization_permissions: [CONSTRUCT_CANDIDATE, PROPOSE_CANDIDATE, ADMIT_CANDIDATE, PROMOTE_CANDIDATE]
  closed_carriers_additional_properties: false
  free_text_in_construction_control: false
  candidate_source_carrier: AgentBodyCandidateSourceV1
  proposal_carrier: AgentBodyProposalV1
  admission_carrier: AgentBodyAdmissionV1
  merge_carrier: AgentBodyMergeV1
  provenance_carrier: AgentBodyProvenanceV1
  construction_ledger_entry: ConstructionLineageEntry
  construction_ledger: ConstructionLineageLedger
  direct_user_construction_lineage:
    - DirectUserExecutableInstructionV1
    - AgentBodyControlAuthorizationV1
    - AgentBodyCandidateSourceV1
    - AgentBodyProposalV1
    - AgentBodyAdmissionV1
    - AgentBodyMergeV1
  research_construction_lineage:
    - IndependentGeneralResearchManifestV1
    - DTPV1
    - MAPV1
    - AgentBodyControlAuthorizationV1
    - AgentBodyCandidateSourceV1
    - AgentBodyProposalV1
    - AgentBodyAdmissionV1
    - AgentBodyMergeV1
  evaluation_taint: permanent
  evaluation_carrier: OpaqueEvaluationReceiptV1
  opaque_evaluation_ledger_entry: OpaqueEvaluationReceiptEntry
  opaque_evaluation_ledger: OpaqueEvaluationReceiptLedger
  evaluation_destination: independent-release-gate-ledger-only
  release_ledger: ReleaseGateLedger
  release_terminal_states: [RELEASED, RELEASE_REJECTED]
  release_rejection_actions: []
  release_to_construction_edges: []
  evaluation_construction_parent_allowed: false
  task_derived_construction_parent_allowed: false
  content_independent_tests: verification-only-accept-or-reject-candidate
  verification_failure_successor_change_allowed: false
  content_or_tool_strategy_branching_allowed: false
  authorization_admission_promotion_content_inspection: false
  main_agent_actions: [dispatch, write_prompts, review, approve, reject]
  main_agent_writes:
    - dispatch_records
    - task_packets
    - prompt_registry
    - review_decisions
    - approval_decisions
    - rejection_decisions
  main_agent_outputs:
    - dispatch_records
    - task_packets
    - prompt_registry
    - review_decisions
    - approval_decisions
    - rejection_decisions
  main_agent_forbidden_outputs:
    - DirectUserExecutableInstructionV1
    - IndependentGeneralResearchManifestV1
    - DTPV1
    - MAPV1
    - AgentBodyControlAuthorizationV1
    - AgentBodyCandidateSourceV1
    - AgentBodyProposalV1
    - AgentBodyAdmissionV1
    - AgentBodyMergeV1
    - AgentBodyProvenanceV1
    - BuildArtifact
    - SolutionArtifact
  effective_prompt_count: 17
  subagent_profile_count: 16
communication_topology:
  type: star
  hub: main_agent
  direct_subagent_to_subagent: false
  artifact_transfer: content-addressed-promoted-snapshots-only

evaluation_firewall:
  evaluation_only_material:
    - real_or_synthetic_task
    - task_variant
    - task_prompt
    - task_data
    - task_answer
    - scores
    - critiques
    - reviews
    - test_failure_details
    - anonymized_abstracted_aggregated_or_cross_task_derivatives
  forbidden_agent_body_destinations:
    - identity
    - capability
    - system_prompts
    - routing
    - shared_implementation
    - tool_policy
    - generic_template
  single_task_action: current_answer_artifact_revision_only
  agent_body_change_requires:
    - DirectUserExecutableInstructionV1_or_IndependentGeneralResearchManifestV1
    - closed_hash_and_enum_control_carriers_only
    - positive_AgentBodyControlAuthorizationV1_lineage
    - positive_candidate_proposal_admission_merge_provenance_lineage
    - no_task_or_evaluation_parent_of_any_origin_or_derivative
    - preregistered_content_independent_tests_are_release_gate_only
  builder_input_allowlist:
    - generic_core_artifacts
    - AgentBodyControlAuthorizationV1
  builder_input_denylist:
    - every_real_or_synthetic_task_and_variant
    - every_task_prompt_data_answer_score_failure_or_review
    - raw_ReviewPacket
    - per_task_score
    - critique
    - reference_solution
    - test_failure_detail
    - every_anonymized_abstracted_aggregated_or_cross_task_derivative
  raw_task_authorized_roles:
    - main_agent
    - benchmark_curator
    - problem_definition_router
    - domain_evidence_researcher
    - data_assumption_analyst
    - model_architect
    - mechanistic_numerical_modeler
    - statistical_learning_modeler
    - optimization_decision_modeler
    - compute_reproducibility_engineer
    - visualization_report_author
    - mathematical_reviewer
    - reproducibility_reviewer
    - evidence_communication_reviewer
  raw_evaluation_authorized_roles:
    - main_agent
    - benchmark_curator
    - mathematical_reviewer
    - reproducibility_reviewer
    - evidence_communication_reviewer
  core_builder_roles:
    - system_architect
    - sandbox_platform_engineer
    - standards_delivery_manager
  identity_build_mode_raw_task_access: forbidden

