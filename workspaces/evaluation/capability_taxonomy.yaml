rules:
  primary_label_required: true
  secondary_labels_allowed: true
  task_identity_fields_forbidden:
    - problem_id
    - problem_title
    - recognizable_background
    - exact_private_field_name
    - target_specific_parameter
    - reference_answer
    - grader_implementation_detail
  defect_unit: independently_researched_task_independent_capability_contract
  unknown_policy: "无法可靠归类时使用 O.GOVERNANCE.UNKNOWN，并进入人工治理，不自动触发修改。"
  evaluation_material_is_not_capability_definition: true
  single_task_failure_action: current_answer_artifact_revision_only
  single_task_failure_packet: RevisionDecision
  agent_body_modification_packet: MAPV1
  agent_body_modification_requires:
    - trusted_independent_task_independent_general_research_or_direct_user_governance
    - no_real_or_synthetic_task_or_evaluation_motivation
    - no_anonymized_abstracted_aggregated_or_cross_task_derivative_motivation
    - preregistered_content_independent_property_and_contract_tests_verification_only
    - no_content_domain_identifier_parameter_answer_pattern_or_tool_policy_branch
    - cross_domain_regression_pass
    - held_out_non_regression_pass
  direct_user_governance_path: DirectUserExecutableInstructionV1_with_independent_review

severity_scale:
  P0:
    name: integrity_or_isolation_breach
    definition: "泄漏、伪造、越权、题目特化或使评测结论无效的缺陷。"
  P1:
    name: critical_correctness_failure
    definition: "关键结论错误、硬约束失败、核心结果无法复算或干净环境无法复现。"
  P2:
    name: material_quality_failure
    definition: "显著削弱完整性、可信度、稳健性或可用性，但未使全部核心结论失效。"
  P3:
    name: minor_quality_failure
    definition: "局部表达、效率或非关键工件问题。"

categories:
  D:
    name: 定义
    description: "把开放式任务转换为可审计的问题、目标、变量、约束和验收条件。"
    capabilities:
      D.REQUIREMENT.COVERAGE:
        name: 子任务完整覆盖
        expected_behavior: "识别全部显式和必要隐式交付要求，并建立覆盖状态。"
        observable_evidence:
          - requirement_inventory
          - coverage_matrix
      D.OBJECTIVE.IDENTIFY:
        name: 目标识别
        expected_behavior: "区分描述性目标、预测目标、优化目标和决策目标，并记录优先级与冲突。"
        observable_evidence:
          - objective_register
          - priority_or_tradeoff_record
      D.CONSTRAINT.TRACE:
        name: 约束追踪
        expected_behavior: "将硬约束、软约束、边界条件和跨阶段约束映射到模型、实现和验证。"
        observable_evidence:
          - constraint_implementation_validation_matrix
      D.VARIABLE.UNIT:
        name: 变量与单位治理
        expected_behavior: "统一变量定义、量纲、单位变换、精度和取值域。"
        observable_evidence:
          - variable_dictionary
          - dimensional_checks
      D.ATTACHMENT.MAP:
        name: 附件映射
        expected_behavior: "将每个原始附件、表、字段和元数据映射到使用位置与处理步骤。"
        observable_evidence:
          - attachment_lineage
      D.AMBIGUITY.MANAGE:
        name: 歧义管理
        expected_behavior: "显式列出歧义、可选解释、选择理由和结果敏感性。"
        observable_evidence:
          - ambiguity_register
      D.ACCEPTANCE.SPECIFY:
        name: 验收条件定义
        expected_behavior: "在建模前定义可验证的正确性、完整性和复现标准。"
        observable_evidence:
          - acceptance_criteria

  U:
    name: 理解
    description: "建立可信的领域、数据、机制、假设和不确定性认识。"
    capabilities:
      U.SOURCE.PROVENANCE:
        name: 来源质量与溯源
        expected_behavior: "优先使用原始或权威来源，区分事实、经验与推断，并保持引用链。"
        observable_evidence:
          - source_ledger
          - claim_source_links
      U.DATA.SCHEMA:
        name: 数据语义理解
        expected_behavior: "解释字段、类型、粒度、键、时间范围、单位和缺失含义。"
        observable_evidence:
          - data_dictionary
          - schema_validation
      U.DATA.QUALITY:
        name: 数据质量与异常处理
        expected_behavior: "识别缺失、异常、重复、偏差和采集限制，并使处理步骤可逆或可审计。"
        observable_evidence:
          - quality_report
          - transformation_lineage
      U.DATA.LEAKAGE:
        name: 数据泄漏防护
        expected_behavior: "防止目标泄漏、时间穿越、训练验证重叠和隐藏评测信息进入构建。"
        observable_evidence:
          - split_audit
          - access_log
      U.MECHANISM.UNDERSTAND:
        name: 机制理解
        expected_behavior: "说明关键因果或机理关系、适用边界及与观测数据的联系。"
        observable_evidence:
          - mechanism_map
          - applicability_notes
      U.ASSUMPTION.BIAS:
        name: 假设与偏差
        expected_behavior: "每个重要假设都有理由、影响方向、可检验性和失效后果。"
        observable_evidence:
          - assumption_register
          - bias_analysis
      U.UNCERTAINTY.CHARACTERIZE:
        name: 不确定性刻画
        expected_behavior: "区分数据、参数、结构、数值和情景不确定性。"
        observable_evidence:
          - uncertainty_register

  C:
    name: 创造
    description: "提出、选择并实现适合任务的可解释模型与算法。"
    capabilities:
      C.BASELINE.ESTABLISH:
        name: 基线建立
        expected_behavior: "先建立简单、可解释、可运行的比较基线。"
        observable_evidence:
          - baseline_definition
          - baseline_results
      C.MODEL.FIT:
        name: 模型适配
        expected_behavior: "模型结构与目标、数据量、机制、约束和资源条件相匹配。"
        observable_evidence:
          - candidate_comparison
          - selection_rationale
      C.IDENTIFIABILITY.CHECK:
        name: 可辨识性与可估计性
        expected_behavior: "检查参数是否能由现有数据识别，避免不可识别模型产生虚假精度。"
        observable_evidence:
          - identifiability_analysis
      C.ALGORITHM.SELECT:
        name: 算法选择
        expected_behavior: "算法与问题结构和规模相适应，并说明收敛、近似或启发式性质。"
        observable_evidence:
          - algorithm_rationale
          - convergence_or_termination_record
      C.FEASIBILITY.PRESERVE:
        name: 可行性保持
        expected_behavior: "生成的解满足硬约束，并明确不可行实例和恢复策略。"
        observable_evidence:
          - feasibility_certificate
          - residual_report
      C.INTERPRETABILITY.PROVIDE:
        name: 可解释性
        expected_behavior: "主要结构、参数和结果能够映射到现实含义，避免只给黑箱结论。"
        observable_evidence:
          - interpretation_map
      C.COMPLEXITY.CONTROL:
        name: 复杂度与资源控制
        expected_behavior: "在精度、复杂度、可维护性和预算间给出可审计取舍。"
        observable_evidence:
          - complexity_report
          - resource_profile

  V:
    name: 验证
    description: "使用独立证据确认数学、数值、实现、表达和复现可信度。"
    capabilities:
      V.RECOMPUTE.INDEPENDENT:
        name: 独立复算
        expected_behavior: "关键结果由独立路径、独立实现或独立评审者复算。"
        observable_evidence:
          - independent_recalculation
      V.CONSTRAINT.CHECK:
        name: 约束与边界验证
        expected_behavior: "自动或手工检查全部硬约束、边界条件、守恒关系和取值域。"
        observable_evidence:
          - constraint_check_report
      V.SENSITIVITY.ANALYZE:
        name: 敏感性与情景分析
        expected_behavior: "识别主导参数、结构选择和假设变化对结论的影响。"
        observable_evidence:
          - sensitivity_report
      V.STOCHASTIC.STABILITY:
        name: 随机稳定性
        expected_behavior: "多种子或重复运行报告分布、尾部失败与随机性来源。"
        observable_evidence:
          - repeated_run_statistics
      V.REPRODUCE.CLEAN:
        name: 干净环境复现
        expected_behavior: "从只读输入和锁定依赖，在新建环境中通过单一入口重建关键工件。"
        observable_evidence:
          - clean_room_log
          - environment_manifest
      V.CONSISTENCY.ARTIFACT:
        name: 工件一致性
        expected_behavior: "报告、表、图、代码输出和数据版本相互一致。"
        observable_evidence:
          - artifact_consistency_check
      V.CLAIM.TRACE:
        name: 主张追踪
        expected_behavior: "关键主张可追溯到数据、代码、推导、假设和原始证据。"
        observable_evidence:
          - claim_evidence_matrix
      V.LIMITATION.DISCLOSE:
        name: 局限性披露
        expected_behavior: "明确适用范围、失败条件、未解决风险和外推限制。"
        observable_evidence:
          - limitation_register

  O:
    name: 运行与编排
    description: "保证多 Agent 工作流在隔离、路由、工具、工件和资源方面可靠运行。"
    capabilities:
      O.ROUTING.CORRECT:
        name: 任务路由
        expected_behavior: "根据能力需求分派角色，避免职责遗漏、冲突或循环。"
        observable_evidence:
          - routing_trace
      O.TOOL.SELECT:
        name: 工具选择与参数
        expected_behavior: "调用必要且获授权的工具，参数正确，失败可恢复。"
        observable_evidence:
          - tool_trace
          - error_recovery_log
      O.CONTEXT.BOUNDARY:
        name: 上下文边界
        expected_behavior: "只向角色提供最小必要上下文，防止越权、串扰和隐私泄漏。"
        observable_evidence:
          - context_manifest
          - access_log
      O.ARTIFACT.VERSION:
        name: 工件版本与提升
        expected_behavior: "工件按哈希、来源和版本提升，消费者只读取已批准快照。"
        observable_evidence:
          - artifact_manifest
          - promotion_record
      O.TRACE.COMPLETE:
        name: 全链路追踪
        expected_behavior: "模型、工具、交接、审批、错误和结果事件均能关联到一次运行。"
        observable_evidence:
          - end_to_end_trace
      O.RESOURCE.BUDGET:
        name: 资源预算
        expected_behavior: "记录并遵守令牌、计算、时延、网络和人工介入预算。"
        observable_evidence:
          - resource_ledger
      O.ISOLATION.ENFORCE:
        name: 隔离执行
        expected_behavior: "作者、评审和不同 Agent 在独立可写环境中运行，原始输入只读。"
        observable_evidence:
          - isolation_attestation
      O.GOVERNANCE.UNKNOWN:
        name: 未分类治理缺陷
        expected_behavior: "记录未知失效并暂停自动修改，等待人工分类与风险评估。"
        observable_evidence:
          - governance_ticket
